<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Favourites | Book Explorer</title>
  </head>
  <body class="min-h-screen bg-amber-50 text-stone-900 antialiased">
    <header class="border-b border-maximum-yellow bg-white">
      <nav class="mx-auto flex max-w-6xl justify-between px-6 py-5" aria-label="Main navigation">
        <a href="./index.html" class="text-xl font-bold text-forest-green">Book Explorer</a>
        <a href="./favourites.html" class="font-medium text-forest-green" aria-current="page">
          Favourites
        </a>
      </nav>
    </header>

    <main class="mx-auto max-w-6xl px-6 py-16">
      <p class="text-sm font-semibold uppercase tracking-[0.2em] text-forest-green">
        Your reading list
      </p>
      <h1 class="mt-3 text-4xl font-bold">Favourite books</h1>
      <p class="mt-3 text-stone-600">Books you have saved to read later.</p>

      <section
        id="favourites-list"
        class="mt-8 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3"
        aria-label="Favourite books"
      ></section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
